[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estudio_criptomonedas"
version = "0.1.0"
description = "Estudio de estrategias de trading sobre criptomonedas"
requires-python = ">=3.10"
authors = [{ name = "Christian" }]

dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "numpy>=2.1",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "black>=24.0", "ruff>=0.7"]
ui  = ["streamlit>=1.40", "plotly>=5.24"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
